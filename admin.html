<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auravine Admin</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;background:#fdeed7;color:#2b3320;font:16px/1.5 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;background:#1d2616;color:#f3ead2;padding:14px 22px}
main{max-width:760px;margin:0 auto;padding:22px}
.card{background:#fff8ea;border:1px solid #d9ceb0;border-radius:14px;padding:20px;margin-bottom:20px}
#login{max-width:360px;margin:12vh auto}
h1,h2{margin:0 0 14px;color:#4b5a2b}
input{display:block;width:100%;padding:11px;margin-bottom:12px;border:1px solid #cbbf9c;border-radius:8px;font:inherit;background:#fff}
button{background:#4b5a2b;color:#fff;border:0;border-radius:99px;padding:10px 20px;font:600 15px system-ui;cursor:pointer}
button.s{background:none;color:#4b5a2b;border:1.5px solid #4b5a2b;padding:6px 14px;font-size:14px}
button.d{background:none;color:#b3261e;border:1.5px solid #b3261e;padding:6px 14px;font-size:14px}
button:disabled{opacity:.5}
#prev{width:110px;border-radius:10px;margin:0 0 12px}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #e6dcc0}
.row img,.row .ph{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#e8dcb0;flex:none}
.row div.t{flex:1;min-width:0}.row small{color:#6b7258}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:#b3261e;color:#fff;border-radius:6px;font-size:11px;padding:1px 7px;margin-left:6px}
#err{color:#b3261e}
</style></head><body>

<div id="login" class="card">
<h1>Auravine Admin</h1>
<input id="em" type="email" placeholder="Email" autocomplete="username">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button id="in">Login</button><p id="err"></p>
</div>

<div id="app" hidden>
<header><b>Auravine Admin</b><button class="s" id="out" style="color:#f3ead2;border-color:#8b9468">Logout</button></header>
<main>
<form id="f" class="card">
<h2 id="ft">Add new product</h2>
<input id="name" placeholder="Product name" required>
<input id="note" placeholder="Short description (scent notes etc.)">
<input id="price" type="number" min="0" placeholder="Price in ₹" required>
<label>Photo (optional)</label>
<input id="file" type="file" accept="image/*">
<img id="prev" hidden alt="">
<button id="save">Save product</button>
<button type="button" class="s" id="cancel" hidden>Cancel edit</button>
</form>
<div class="card"><h2>Your products</h2><div id="list">Loading...</div></div>
</main></div>

<script type="module">
// ====== PASTE YOUR FIREBASE CONFIG HERE ======
const firebaseConfig={
  apiKey: "AIzaSyD3Tlnouh_z7ZLAkolX-aIxqIwHZeGXdV4",
  authDomain: "auravine-backend.firebaseapp.com",
  projectId: "auravine-backend",
  storageBucket: "auravine-backend.firebasestorage.app",
  messagingSenderId: "949943989995",
  appId: "1:949943989995:web:a51be2a7e4d736b92ab0ae"
};
// =============================================
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import {getFirestore,collection,query,orderBy,getDocs,addDoc,updateDoc,deleteDoc,doc} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),col=collection(db,"products");
const ref=id=>doc(db,"products",id);
const $=s=>document.querySelector(s);
let items=[],editId=null,imgData="";

onAuthStateChanged(auth,u=>{$("#login").hidden=!!u;$("#app").hidden=!u;if(u)load()});
$("#in").onclick=()=>signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value).catch(()=>$("#err").textContent="Wrong email or password");
$("#out").onclick=()=>signOut(auth);

async function load(){
  try{const s=await getDocs(query(col,orderBy("created")));items=s.docs.map(d=>({id:d.id,...d.data()}));draw()}
  catch(e){$("#list").textContent="Could not load: "+e.message}
}
function draw(){
  $("#list").innerHTML=items.length?items.map(p=>`<div class="row">
  ${p.img?`<img src="${p.img}" alt="">`:`<div class="ph"></div>`}
  <div class="t"><b>${esc(p.name)}</b>${p.soldOut?'<span class="tag">Sold out</span>':""}<br><small>${esc(p.note||"")} · ₹${p.price}</small></div>
  <div class="acts"><button class="s" data-a="edit" data-i="${p.id}">Edit</button>
  <button class="s" data-a="sold" data-i="${p.id}">${p.soldOut?"Mark in stock":"Mark sold out"}</button>
  <button class="d" data-a="del" data-i="${p.id}">Delete</button></div></div>`).join(""):"No products yet. Add your first one above.";
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const w=Math.min(800,im.width),h=im.height*w/im.width,c=document.createElement("canvas");
    c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    imgData=c.toDataURL("image/jpeg",.8);$("#prev").src=imgData;$("#prev").hidden=false};im.src=r.result};
  r.readAsDataURL(f);
};
function reset(){editId=null;imgData="";$("#f").reset();$("#prev").hidden=true;$("#ft").textContent="Add new product";$("#cancel").hidden=true}
$("#cancel").onclick=reset;

$("#f").onsubmit=async e=>{
  e.preventDefault();const b=$("#save");b.disabled=true;
  const d={name:$("#name").value.trim(),note:$("#note").value.trim(),price:+$("#price").value};
  if(imgData)d.img=imgData;
  try{
    if(editId)await updateDoc(ref(editId),d);else await addDoc(col,{...d,soldOut:false,created:Date.now()});
    reset();await load();
  }catch(x){alert("Save failed: "+x.message)}
  b.disabled=false;
};

$("#list").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  const p=items.find(x=>x.id==b.dataset.i);if(!p)return;
  try{
    if(b.dataset.a=="del"&&confirm(`Delete "${p.name}"?`)){await deleteDoc(ref(p.id));await load()}
    if(b.dataset.a=="sold"){await updateDoc(ref(p.id),{soldOut:!p.soldOut});await load()}
    if(b.dataset.a=="edit"){editId=p.id;imgData="";$("#name").value=p.name;$("#note").value=p.note||"";$("#price").value=p.price;
      $("#prev").src=p.img||"";$("#prev").hidden=!p.img;$("#ft").textContent="Edit product";$("#cancel").hidden=false;scrollTo({top:0,behavior:"smooth"})}
  }catch(x){alert("Failed: "+x.message)}
};
</script></body></html>
