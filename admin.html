<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auravine Admin</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;background:#fdeed7;color:#2b3320;font:16px/1.5 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;background:#1d2616;color:#f3ead2;padding:14px 22px}
main{max-width:760px;margin:0 auto;padding:22px}
.card{background:#fff8ea;border:1px solid #d9ceb0;border-radius:14px;padding:20px;margin-bottom:20px}
#login{max-width:360px;margin:12vh auto}
h1,h2{margin:0 0 14px;color:#4b5a2b}
input,select,textarea{display:block;width:100%;padding:11px;margin-bottom:12px;border:1px solid #cbbf9c;border-radius:8px;font:inherit;background:#fff}
button{background:#4b5a2b;color:#fff;border:0;border-radius:99px;padding:10px 20px;font:600 15px system-ui;cursor:pointer}
button.s{background:none;color:#4b5a2b;border:1.5px solid #4b5a2b;padding:6px 14px;font-size:14px}
button.d{background:none;color:#b3261e;border:1.5px solid #b3261e;padding:6px 14px;font-size:14px}
button:disabled{opacity:.5}
small.h{display:block;color:#6b7258;margin:-6px 0 12px}
#thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.th{position:relative}.th img{width:84px;height:105px;object-fit:cover;border-radius:10px;display:block}
.th button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;padding:0;border-radius:50%;background:#b3261e;font-size:16px;line-height:1}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #e6dcc0}
.row>img,.row .ph{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#e8dcb0;flex:none}
.row div.t{flex:1;min-width:0}.row small{color:#6b7258}
.rimgs{display:flex;gap:6px;margin-top:8px}.rimgs img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{color:#fff;border-radius:6px;font-size:11px;padding:1px 7px;margin-left:6px;background:#b3261e}
#err{color:#b3261e}
</style></head><body>

<div id="login" class="card">
<h1>Auravine Admin</h1>
<input id="em" type="email" placeholder="Email" autocomplete="username">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button id="in">Login</button><p id="err"></p>
</div>

<div id="app" hidden>
<header><b>Auravine Admin</b><button class="s" id="out" style="color:#f3ead2;border-color:#8b9468">Logout</button></header>
<main>
<form id="f" class="card">
<h2 id="ft">Add new product</h2>
<input id="name" placeholder="Product name" required>
<input id="note" placeholder="Short description (scent notes etc.)">
<input id="price" type="number" min="0" placeholder="Price in ₹" required>
<label>Photos (up to 4, the first one is the main photo)</label>
<input id="file" type="file" accept="image/*" multiple>
<div id="thumbs"></div>
<label>Photo fit</label>
<select id="fit"><option value="cover">Fill the box (crops edges)</option><option value="contain">Show full photo (nothing cropped)</option></select>
<button id="save">Save product</button>
<button type="button" class="s" id="cancel" hidden>Cancel edit</button>
</form>
<div class="card"><h2>Your products</h2><div id="list">Loading...</div></div>

<div class="card"><h2>Customer reviews</h2><div id="rlist">Loading...</div></div>
<form id="rf" class="card"><h2>Add a review manually</h2>
<small class="h">Only add real reviews your customers sent you (WhatsApp, Instagram). Keep the chat screenshot as proof of permission.</small>
<input id="rn" placeholder="Customer's first name" required>
<input id="rc" placeholder="City (optional)">
<input id="rp" placeholder="Product (optional)">
<select id="rr"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select>
<textarea id="rt" rows="3" placeholder="Their feedback" required minlength="10" maxlength="600"></textarea>
<label>Photos (optional, up to 2)</label>
<input id="rfile" type="file" accept="image/*" multiple>
<small class="h" id="rcount"></small>
<label><input id="rok" type="checkbox" required style="display:inline;width:auto;margin-right:8px">The customer gave permission to show this on the website</label><br><br>
<button>Add review</button></form>
</main></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import {getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,deleteField,doc,query,orderBy} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

// ====== FIREBASE CONFIG ======
const firebaseConfig={
  apiKey: "AIzaSyD3Tlnouh_z7ZLAkolX-aIxqIwHZeGXdV4",
  authDomain: "auravine-backend.firebaseapp.com",
  projectId: "auravine-backend",
  storageBucket: "auravine-backend.firebasestorage.app",
  messagingSenderId: "949943989995",
  appId: "1:949943989995:web:a51be2a7e4d736b92ab0ae"
};
// =============================
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const pcol=collection(db,"products"),rcol=collection(db,"reviews");
const pref=id=>doc(db,"products",id),rref=id=>doc(db,"reviews",id);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shrink=(f,max,q)=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const w=Math.min(max,im.width),h=im.height*w/im.width,c=document.createElement("canvas");
  c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  res(c.toDataURL("image/jpeg",q))};im.src=r.result};r.readAsDataURL(f)});

onAuthStateChanged(auth,u=>{$("#login").hidden=!!u;$("#app").hidden=!u;if(u){load();loadReviews()}});
$("#in").onclick=()=>signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value).catch(()=>$("#err").textContent="Wrong email or password");
$("#out").onclick=()=>signOut(auth);

/* ---------- Products ---------- */
const MAX=4;
let items=[],editId=null,imgs=[];
const photos=p=>p.imgs&&p.imgs.length?p.imgs:(p.img?[p.img]:[]);
async function load(){
  try{const s=await getDocs(query(pcol,orderBy("created")));items=s.docs.map(d=>({id:d.id,...d.data()}));draw()}
  catch(e){$("#list").textContent="Could not load: "+e.message}
}
function draw(){
  $("#list").innerHTML=items.length?items.map(p=>{const a=photos(p);return `<div class="row">
  ${a[0]?`<img src="${a[0]}" alt="">`:`<div class="ph"></div>`}
  <div class="t"><b>${esc(p.name)}</b>${p.soldOut?'<span class="tag">Sold out</span>':""}<br><small>${esc(p.note||"")} · ₹${p.price} · ${a.length} photo${a.length==1?"":"s"}</small></div>
  <div class="acts"><button class="s" data-a="edit" data-i="${p.id}">Edit</button>
  <button class="s" data-a="sold" data-i="${p.id}">${p.soldOut?"Mark in stock":"Mark sold out"}</button>
  <button class="d" data-a="del" data-i="${p.id}">Delete</button></div></div>`}).join(""):"No products yet. Add your first one above.";
}
function thumbs(){$("#thumbs").innerHTML=imgs.map((s,i)=>`<span class="th"><img src="${s}" alt=""><button type="button" data-x="${i}" aria-label="Remove photo">×</button></span>`).join("")}
$("#thumbs").onclick=e=>{const b=e.target.closest("button");if(b){imgs.splice(+b.dataset.x,1);thumbs()}};
$("#file").onchange=async e=>{
  for(const f of e.target.files){if(imgs.length>=MAX){alert("Maximum "+MAX+" photos per product");break}imgs.push(await shrink(f,700,.75))}
  e.target.value="";thumbs();
};
function reset(){editId=null;imgs=[];$("#f").reset();thumbs();$("#ft").textContent="Add new product";$("#cancel").hidden=true}
$("#cancel").onclick=reset;
$("#f").onsubmit=async e=>{
  e.preventDefault();
  const d={name:$("#name").value.trim(),note:$("#note").value.trim(),price:+$("#price").value,fit:$("#fit").value,imgs};
  if(JSON.stringify(imgs).length>900000){alert("Photos are too large together. Remove one photo.");return}
  const b=$("#save");b.disabled=true;
  try{
    if(editId)await updateDoc(pref(editId),{...d,img:deleteField()});else await addDoc(pcol,{...d,soldOut:false,created:Date.now()});
    reset();await load();
  }catch(x){alert("Save failed: "+x.message)}
  b.disabled=false;
};
$("#list").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  const p=items.find(x=>x.id==b.dataset.i);if(!p)return;
  try{
    if(b.dataset.a=="del"&&confirm(`Delete "${p.name}"?`)){await deleteDoc(pref(p.id));await load()}
    if(b.dataset.a=="sold"){await updateDoc(pref(p.id),{soldOut:!p.soldOut});await load()}
    if(b.dataset.a=="edit"){editId=p.id;imgs=[...photos(p)];thumbs();$("#name").value=p.name;$("#note").value=p.note||"";$("#price").value=p.price;
      $("#fit").value=p.fit||"cover";$("#ft").textContent="Edit product";$("#cancel").hidden=false;scrollTo({top:0,behavior:"smooth"})}
  }catch(x){alert("Failed: "+x.message)}
};

/* ---------- Reviews ---------- */
let revs=[],rimgs=[];
async function loadReviews(){
  try{const s=await getDocs(query(rcol,orderBy("created","desc")));revs=s.docs.map(d=>({id:d.id,...d.data()}));drawRev()}
  catch(e){$("#rlist").textContent="Could not load: "+e.message}
}
function drawRev(){
  const n=revs.filter(r=>!r.approved).length;
  $("#rlist").innerHTML=revs.length?(n?`<p><b>${n} waiting for your approval</b></p>`:"")+revs.map(r=>`<div class="row"><div class="t"><b>${esc(r.name)}</b>${r.city?", "+esc(r.city):""} <span class="tag" style="background:${r.approved?"#4b5a2b":"#c27a00"}">${r.approved?"Live":"Pending"}</span><br>${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}<br><small>${esc(r.text)}</small>${r.imgs&&r.imgs.length?`<div class="rimgs">${r.imgs.map(s=>`<img src="${s}" alt="">`).join("")}</div>`:""}</div><div class="acts"><button class="s" data-r="ok" data-i="${r.id}">${r.approved?"Hide":"Approve"}</button><button class="d" data-r="del" data-i="${r.id}">Delete</button></div></div>`).join(""):"No reviews yet.";
}
$("#rlist").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  const r=revs.find(x=>x.id==b.dataset.i);if(!r)return;
  try{
    if(b.dataset.r=="ok"){await updateDoc(rref(r.id),{approved:!r.approved});await loadReviews()}
    if(b.dataset.r=="del"&&confirm("Delete this review?")){await deleteDoc(rref(r.id));await loadReviews()}
  }catch(x){alert("Failed: "+x.message)}
};
$("#rfile").onchange=async e=>{
  for(const f of e.target.files){if(rimgs.length>=2){alert("Maximum 2 photos per review");break}rimgs.push(await shrink(f,640,.7))}
  e.target.value="";$("#rcount").textContent=rimgs.length?rimgs.length+" photo(s) added":"";
};
$("#rf").onsubmit=async e=>{
  e.preventDefault();
  try{
    const d={name:$("#rn").value.trim(),city:$("#rc").value.trim(),product:$("#rp").value.trim(),rating:+$("#rr").value,text:$("#rt").value.trim(),approved:true,created:Date.now()};
    if(rimgs.length)d.imgs=rimgs;
    await addDoc(rcol,d);
    $("#rf").reset();rimgs=[];$("#rcount").textContent="";await loadReviews();
  }catch(x){alert("Save failed: "+x.message)}
};
</script></body></html>
